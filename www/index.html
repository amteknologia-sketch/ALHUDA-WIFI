<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4a37">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob: capacitor: http: https:">
<title>DAYAH AL-HUDA MALIKUSSALEH</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="assets/app.css">
<script>try{document.documentElement.setAttribute("data-theme",JSON.parse(localStorage.getItem("ahb_theme"))||"hijau")}catch(e){document.documentElement.setAttribute("data-theme","hijau")}</script>
</head>
<body>
<header class="topbar">
  <img src="assets/logo.svg" alt="" class="brand-logo">
  <div class="brand-text">
    <strong id="headerText">ALHUDA_D.NET</strong>
    <small><i id="netDot" class="net-dot"></i><span id="siteTitle">DAYAH AL-HUDA MALIKUSSALEH</span></small>
  </div>
  <div class="hdr-actions">
  <button id="themeBtn" class="icon-btn" aria-label="Tema" title="Tema">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3a9 9 0 0 0 0 18c1 0 1.7-.8 1.7-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.7 1.7-1.7h2A4.6 4.6 0 0 0 21 10.6C21 6.4 17 3 12 3zM6.5 12a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
  </button>
  <button id="settingsBtn" class="icon-btn" aria-label="Peraturan" title="Peraturan">
    <svg id="icGear" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4l-.4 2.6c-.6.2-1.2.6-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.8 1.7 1l.4 2.6h4l.4-2.6c.6-.2 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
    <svg id="icClose" viewBox="0 0 24 24" width="22" height="22" hidden><path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7l-1.4-1.4L9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z" transform="translate(1.2 0)"/></svg>
    <i id="notifDot" class="dot" hidden></i>
  </button>
  </div>
</header>

<main id="view" class="container"></main>

<div id="sheet" class="sheet" hidden><div class="sheet-card" id="sheetCard"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="assets/backend.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
